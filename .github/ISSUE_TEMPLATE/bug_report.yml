name: Bug report
description: Something in myKit doesn't work as its doc comments describe. Feature requests are closed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: myKit is a personal project; bug reports are welcome, but there is no promise of a fix or a reply. See CONTRIBUTING.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: myKit version
      placeholder: 0.1.0
